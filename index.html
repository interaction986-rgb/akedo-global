<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKEDO GLOBAL LEADERBOARD</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body{background:#0f0f1e;color:white;font-family:Arial,sans-serif;text-align:center;margin:0;padding:10px}
h1{font-size:30px;color:#ffcc00;text-shadow:3px 3px 0 #ff0066}
.topbar{font-size:18px;background:#2a2a44;padding:10px;border-radius:12px;border:2px solid gold}
.grid{display:flex;flex-wrap:wrap;justify-content:center}
.card{background:#2a2a44;border:3px solid #555;border-radius:12px;padding:10px;margin:5px;width:120px;cursor:pointer}
.card.selected{border-color:#00ff00;background:#2e5a2e}
.card .emo{font-size:36px;display:block}
button{background:#ff0066;color:white;border:0;padding:12px;font-size:16px;border-radius:12px;margin:5px;width:95%;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
button.green{background:#00aa00} button.blue{background:#0088ff} button.orange{background:#ffaa00;color:black} button.gold{background:gold;color:black}
input{padding:12px;font-size:17px;border-radius:10px;border:0;width:85%;text-align:center;margin:5px;box-sizing:border-box}
.bar{height:26px;background:#333;border-radius:10px;overflow:hidden;margin:6px 0}
.fill{height:100%;background:#00ff00;transition:width .5s}
.enemy-fill{background:#ff3333}
.arena{font-size:60px;margin:10px 0}
#log{background:#111;padding:10px;border-radius:10px;min-height:70px}
.hidden{display:none}
.leader{background:#1e1e3a;border-radius:12px;padding:10px;margin:8px 0;text-align:right}
.leaderRow{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #333;gap:8px}
.leaderRow.me{background:#3a2a00;border:2px solid gold;border-radius:8px}
.rank1{color:gold;font-weight:bold} .rank2{color:silver} .rank3{color:#cd7f32}
.onlineBox{background:#1e2a4a;border:2px solid #00ffff;padding:12px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>
<h1>⚔️ AKEDO GLOBAL ⚔️</h1>
<div class="topbar">👤 <span id="myNameText">שחקן</span> | 🪙 <span id="coinsText">100</span> | 🏆 <span id="winsText">0</span> | ⭐ <span id="pointsText">0</span></div>

<div id="nameBox" style="background:#2a2a44;padding:12px;border-radius:12px;margin:8px">
<p>👇 תכתוב את השם שלך ללוח העולמי 👇</p>
<input id="nameInput" maxlength="24" placeholder="השם שלך... למשל: דניאל המלך">
<button class="gold" onclick="saveName()">💾 שמור שם והיכנס ללוח העולמי</button>
</div>

<div id="menu">
<button onclick="showTab('fight')" style="background:#333">⚔️ קרב</button>
<button onclick="showTab('shop')" class="orange">🛒 חנות</button>
<button onclick="showTab('leader')" class="gold">🌍 לוח תוצאות עולמי</button>
<div id="fightTab">
<div class="onlineBox"><h3>🌐 אונליין עם חבר</h3><button class="blue" onclick="createRoom()">➕ צור חדר</button><p id="myCode" style="color:gold;font-size:20px"></p><input id="joinCode" placeholder="קוד של חבר (6–8 ספרות)" inputmode="numeric" maxlength="8"><button class="green" onclick="joinRoom()">🚀 הצטרף</button></div>
<div id="connectionStatus" aria-live="polite"></div>
<div class="grid" id="warriorGrid"></div>
<button onclick="startOffline()">🤖 קרב נגד המחשב</button>
</div>
<div id="shopTab" class="hidden"><h2>🛒 חנות - הכל +200</h2><div class="grid" id="shopGrid"></div></div>
<div id="leaderTab" class="hidden">
<h2>🌍 לוח תוצאות עולמי - TOP 20</h2>
<p id="leaderStatus">טוען...</p>
<div id="leaderList"></div>
<button onclick="loadLeaderboard()">🔄 רענן לוח</button>
<p style="font-size:13px;color:#aaa">ניצחון = +100 נקודות | הפסד = +10 נקודות | SPLIT STRIKE = +50 בונוס</p>
</div>
</div>

<div id="battleScreen" class="hidden">
<div class="arena"><span id="playerEmoji">🦖</span> VS <span id="enemyEmoji">🥷</span></div>
<p id="modeText"></p>
<p><b>אתה:</b> <span id="playerName"></span></p><div class="bar"><div id="playerBar" class="fill" style="width:100%"></div></div>
<p><b>יריב:</b> <span id="enemyName"></span></p><div class="bar"><div id="enemyBar" class="fill enemy-fill" style="width:100%"></div></div>
<div id="log">READY? FIGHT!</div>
<div id="myTurnBtns"><button onclick="sendAttack(1)">👊 אגרוף</button><button onclick="sendAttack(2)">🌀 מיוחדת</button><button onclick="sendAttack(3)">🛡️ הגנה</button><button onclick="sendAttack(4)">💥 SPLIT STRIKE</button></div>
<p id="waitText" class="hidden">⏳ מחכה ליריב...</p>
<button onclick="backToMenu()" style="background:#333">🔙 חזרה</button>
</div>

<script>
const warriors=[
 {name:"Tailwhip",emoji:"🦖",hp:120,power:22,price:200},
 {name:"Nightblade",emoji:"🥷",hp:100,power:25,price:200},
 {name:"Hyperlock",emoji:"🤖",hp:130,power:20,price:200},
 {name:"Shreddy Bear",emoji:"🧸",hp:110,power:30,price:200},
 {name:"Mizuchi",emoji:"🐲",hp:90,power:35,price:200},
 {name:"Buster Splits",emoji:"🥊",hp:115,power:24,price:250},
 {name:"Chux Lee",emoji:"🥋",hp:105,power:26,price:250},
 {name:"Volta",emoji:"⚡",hp:90,power:32,price:280},
 {name:"Storm Strike",emoji:"🌪️",hp:110,power:28,price:300},
 {name:"Fire Fist",emoji:"🔥",hp:105,power:30,price:300},
 {name:"Shadow Shogun",emoji:"👺",hp:95,power:34,price:320},
 {name:"Venom Fang",emoji:"🕷️",hp:90,power:36,price:400},
 {name:"Legendary Tailwhip",emoji:"👑🦖",hp:160,power:30,price:550},
 {name:"Ultimate Mizuchi",emoji:"👑🐲",hp:140,power:38,price:600},
 {name:"Shadow King",emoji:"👑😈",hp:130,power:40,price:600},
 {name:"Giant Tailwhip",emoji:"🦖💪",hp:200,power:25,price:700},
 {name:"Ninja Boss",emoji:"🥷👹",hp:170,power:28,price:800},
 {name:"Akedo Champion",emoji:"🏆",hp:180,power:30,price:1000}
];
const LEADER_URL="https://akedo-global-default-rtdb.firebaseio.com/scores.json";
let coins=parseInt(localStorage.getItem('akedo_coins')||'100',10);
let wins=parseInt(localStorage.getItem('akedo_wins')||'0',10);
let points=parseInt(localStorage.getItem('akedo_points')||'0',10);
let myName=localStorage.getItem('akedo_name')||'';
let owned=JSON.parse(localStorage.getItem('akedo_owned')||'[0]');
let playerIdx=0,player,enemy,myTurn=true,isOnline=false,isHost=false,peer=null,conn=null,defending=false,enemyDefending=false,splitUsed=false,gameOver=false;

function save(){
 localStorage.setItem('akedo_coins',coins);localStorage.setItem('akedo_wins',wins);localStorage.setItem('akedo_points',points);localStorage.setItem('akedo_owned',JSON.stringify(owned));
 document.getElementById('coinsText').textContent=coins;document.getElementById('winsText').textContent=wins;document.getElementById('pointsText').textContent=points;document.getElementById('myNameText').textContent=myName||'שחקן';
}
function saveName(){
 const value=document.getElementById('nameInput').value.trim();
 if(!value){alert('תכתוב שם!');return;}
 myName=value;localStorage.setItem('akedo_name',value);save();uploadScore();loadLeaderboard();alert('ברוך הבא '+value+'! אתה עכשיו בלוח העולמי 🌍');
}
async function uploadScore(){
 if(!myName)return;
 try{await fetch(LEADER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName,wins:wins,points:points,coins:coins,time:Date.now()})});}catch(error){console.warn('Leaderboard upload failed:',error);}
 const local=JSON.parse(localStorage.getItem('akedo_local_leader')||'[]');local.push({name:myName,wins:wins,points:points});localStorage.setItem('akedo_local_leader',JSON.stringify(local));
}
async function loadLeaderboard(){
 const status=document.getElementById('leaderStatus');status.textContent='טוען לוח עולמי...';
 let list=[];let remoteAvailable=false;
 const isValidScore=item=>item&&typeof item.name==='string'&&Number.isFinite(Number(item.points));
 try{
  const response=await fetch(LEADER_URL);if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();if(data&&typeof data==='object')Object.values(data).filter(isValidScore).forEach(item=>list.push(item));
  remoteAvailable=true;
 }catch(error){console.warn('Leaderboard unavailable:',error);}
 const local=JSON.parse(localStorage.getItem('akedo_local_leader')||'[]');list=list.concat(local.filter(isValidScore));
 if(list.length===0)list=[{name:'Akedo King 👑',wins:45,points:4500},{name:'דניאל המלך',wins:32,points:3200},{name:'נינגה 123',wins:28,points:2800},{name:'🦖 דינו',wins:20,points:2000},{name:'שחקן חדש',wins:5,points:500}];
 const best={};list.forEach(item=>{if(item&&typeof item.name==='string'&&Number.isFinite(Number(item.points))&&(!best[item.name]||Number(item.points)>Number(best[item.name].points)))best[item.name]=item;});
 let entries=Object.values(best).sort((a,b)=>Number(b.points)-Number(a.points)).slice(0,20);
 if(myName&&!entries.some(item=>item.name===myName))entries.push({name:myName,wins:wins,points:points});
 entries.sort((a,b)=>Number(b.points)-Number(a.points));
 const container=document.getElementById('leaderList');container.replaceChildren();
 const leader=document.createElement('div');leader.className='leader';
 entries.forEach((item,index)=>{
  const row=document.createElement('div');row.className='leaderRow'+(item.name===myName?' me':'');
  const name=document.createElement('span');name.className=index===0?'rank1':index===1?'rank2':index===2?'rank3':'';
  const medal=index===0?'🥇':index===1?'🥈':index===2?'🥉':(index+1)+'.';
  name.textContent=medal+' '+item.name+(item.name===myName?' (אתה!)':'');
  const score=document.createElement('span');score.textContent='🏆 '+(Number(item.wins)||0)+' | ⭐ '+(Number(item.points)||0);
  row.append(name,score);leader.appendChild(row);
 });
 container.appendChild(leader);status.textContent=remoteAvailable?'🌍 '+entries.length+' שחקנים בלוח העולמי':'לוח מקומי/דוגמה: שרת הניקוד הגלובלי לא זמין';
}
function showTab(tab){
 ['fightTab','shopTab','leaderTab'].forEach(id=>document.getElementById(id).classList.add('hidden'));
 document.getElementById(tab+'Tab').classList.remove('hidden');if(tab==='leader')loadLeaderboard();
}
function render(){
 const grid=document.getElementById('warriorGrid');grid.replaceChildren();
 warriors.forEach((warrior,index)=>{
  if(!owned.includes(index))return;
  const card=document.createElement('div');card.className='card'+(index===playerIdx?' selected':'');
  card.innerHTML='<span class="emo"></span><b></b><br>❤️ '+warrior.hp+' | 👊 '+warrior.power+'<br>🪙 '+warrior.price;
  card.querySelector('.emo').textContent=warrior.emoji;card.querySelector('b').textContent=warrior.name;
  card.onclick=()=>{playerIdx=index;render();};grid.appendChild(card);
 });
 const shop=document.getElementById('shopGrid');shop.replaceChildren();
 warriors.forEach((warrior,index)=>{
  const has=owned.includes(index);const card=document.createElement('div');card.className='card';
  card.innerHTML='<span class="emo"></span><b></b><br>❤️ '+warrior.hp+' | 👊 '+warrior.power+'<br>'+(has?'✅ יש לך!':'🪙 '+warrior.price);
  card.querySelector('.emo').textContent=warrior.emoji;card.querySelector('b').textContent=warrior.name;
  if(!has){const buy=document.createElement('button');buy.className='orange';buy.textContent='קנה';buy.onclick=()=>{if(coins<warrior.price){alert('אין מספיק!');return;}coins-=warrior.price;owned.push(index);save();render();};card.appendChild(buy);}
  shop.appendChild(card);
 });
}
function closePeer(){if(conn){conn.close();conn=null;}if(peer){peer.destroy();peer=null;}isOnline=false;}
function backToMenu(){closePeer();document.getElementById('battleScreen').classList.add('hidden');document.getElementById('menu').classList.remove('hidden');showTab('fight');}
function setConnectionStatus(message){document.getElementById('connectionStatus').textContent=message;}
function createRoom(){
 if(peer)return;
 if(typeof Peer==='undefined'){setConnectionStatus('לא ניתן לטעון את PeerJS. בדוק חיבור לאינטרנט ורענן את הדף.');return;}
 const code=String(Math.floor(10000000+Math.random()*90000000));
 const codeLabel=document.getElementById('myCode');codeLabel.textContent='יוצר חדר...';setConnectionStatus('');
 peer=new Peer('akedo-'+code);
 peer.on('open',()=>{codeLabel.textContent='הקוד שלך: '+code+' - שלח לחבר!';setConnectionStatus('ממתין לשחקן נוסף...');});
 peer.on('connection',connection=>{conn=connection;setupConn(true);setConnectionStatus('שחקן מצטרף...');});
 peer.on('error',error=>{setConnectionStatus(error.type==='unavailable-id'?'הקוד תפוס. לחץ שוב כדי ליצור חדר חדש.':'שגיאת חיבור: '+error.message);if(peer){peer.destroy();peer=null;}});
}
function joinRoom(){
 const code=document.getElementById('joinCode').value.trim();
 if(!/^\d{6,8}$/.test(code)){setConnectionStatus('יש להזין קוד בן 6–8 ספרות.');return;}
 if(peer)return;
 if(typeof Peer==='undefined'){setConnectionStatus('לא ניתן לטעון את PeerJS. בדוק חיבור לאינטרנט ורענן את הדף.');return;}
 setConnectionStatus('מתחבר לחדר...');peer=new Peer();
 peer.on('open',()=>{conn=peer.connect('akedo-'+code);setupConn(false);});
 peer.on('error',error=>{setConnectionStatus('שגיאת חיבור: '+error.message);if(peer){peer.destroy();peer=null;}});
}
function setupConn(host){
 isHost=host;isOnline=true;
 conn.on('open',()=>{setConnectionStatus('התחברת בהצלחה! הקרב מתחיל.');conn.send({type:'start',warrior:playerIdx});});
 conn.on('data',data=>{if(!data||typeof data!=='object')return;if(data.type==='start'&&Number.isInteger(data.warrior)&&warriors[data.warrior])startOnlineBattle(data.warrior);if(data.type==='attack'&&Number.isInteger(data.attack))receiveAttack(data.attack);});
 conn.on('close',()=>setConnectionStatus('החיבור לשחקן נסגר.'));
 conn.on('error',error=>setConnectionStatus('שגיאת חיבור: '+error.message));
}
function startOnlineBattle(enemyIndex){
 player={...warriors[playerIdx],max:warriors[playerIdx].hp};enemy={...warriors[enemyIndex],max:warriors[enemyIndex].hp};myTurn=isHost;gameOver=false;splitUsed=false;defending=false;enemyDefending=false;
 document.getElementById('menu').classList.add('hidden');document.getElementById('battleScreen').classList.remove('hidden');document.getElementById('modeText').textContent='🌐 אונליין';document.getElementById('playerEmoji').textContent=player.emoji;document.getElementById('enemyEmoji').textContent=enemy.emoji;updateBars();updateTurnUI();document.getElementById('log').textContent='READY? FIGHT!';
}
function updateTurnUI(){
 document.getElementById('myTurnBtns').classList.toggle('hidden',!myTurn||gameOver);document.getElementById('waitText').classList.toggle('hidden',myTurn||gameOver);document.getElementById('modeText').textContent=gameOver?'🏁 נגמר!':(myTurn?'✅ תורך!':'⏳ תור היריב...');
}
function sendAttack(type){
 if(!myTurn||gameOver)return;
 if(type===4&&splitUsed){document.getElementById('log').textContent='כבר השתמשת ב-SPLIT STRIKE!';return;}
 doAttack(type,true);
 if(isOnline&&conn&&conn.open)conn.send({type:'attack',attack:type});
 else if(!gameOver){myTurn=false;updateTurnUI();setTimeout(enemyOfflineTurn,800);}
}
function doAttack(type,isMe){
 const log=document.getElementById('log');const attacker=isMe?player:enemy;const defender=isMe?enemy:player;const isDefending=isMe?enemyDefending:defending;
 if(type===3){if(isMe)defending=true;else enemyDefending=true;log.textContent='🛡️ מתגונן!';if(isOnline){myTurn=!isMe;updateTurnUI();}return;}
 if(isDefending){log.textContent='🛡️ חסום!';if(isMe)enemyDefending=false;else defending=false;}
 else{
  let damage=0;if(type===1)damage=attacker.power;
  if(type===2){if(Math.random()<.5)damage=35;else log.textContent='😱 החטאה!';}
  if(type===4){splitUsed=true;damage=50;log.textContent='💥 SPLIT STRIKE! ';}
  defender.hp-=damage;if(damage>0)log.textContent=(isMe?'👊 פגעת! ':'💥 היריב פגע! ')+damage+' נזק!';
 }
 updateBars();
 if(defender.hp<=0){gameOver=true;if(isMe){wins++;coins+=50;points+=100;save();uploadScore();log.textContent='🏆 ניצחת! +50 🪙 +100 ⭐';}else{coins+=10;points+=10;save();uploadScore();log.textContent='💔 הפסדת... +10 ⭐';}updateTurnUI();return;}
 if(isOnline){myTurn=!isMe;updateTurnUI();}
}
function receiveAttack(type){if([1,2,3,4].includes(type))doAttack(type,false);}
function enemyOfflineTurn(){
 if(gameOver)return;
 if(defending){document.getElementById('log').textContent+='\n🛡️ חסמת!';defending=false;}
 else{const damage=enemy.power;player.hp-=damage;document.getElementById('log').textContent+='\n💥 המחשב תקף! '+damage;updateBars();}
 if(player.hp<=0){coins+=10;points+=10;save();uploadScore();gameOver=true;document.getElementById('log').textContent+='\n💔 הפסדת...';}
 if(!gameOver)myTurn=true;updateTurnUI();
}
function startOffline(){
 closePeer();player={...warriors[playerIdx],max:warriors[playerIdx].hp};let enemyIndex=Math.floor(Math.random()*warriors.length);if(enemyIndex===playerIdx)enemyIndex=(enemyIndex+1)%warriors.length;enemy={...warriors[enemyIndex],max:warriors[enemyIndex].hp};
 isOnline=false;myTurn=true;gameOver=false;splitUsed=false;defending=false;document.getElementById('menu').classList.add('hidden');document.getElementById('battleScreen').classList.remove('hidden');document.getElementById('modeText').textContent='🤖 נגד המחשב';document.getElementById('playerEmoji').textContent=player.emoji;document.getElementById('enemyEmoji').textContent=enemy.emoji;updateBars();updateTurnUI();document.getElementById('log').textContent='READY? FIGHT!';
}
function updateBars(){
 document.getElementById('playerBar').style.width=Math.max(0,player.hp/player.max*100)+'%';document.getElementById('enemyBar').style.width=Math.max(0,enemy.hp/enemy.max*100)+'%';document.getElementById('playerName').textContent=player.name+' - '+Math.max(0,player.hp);document.getElementById('enemyName').textContent=enemy.name+' - '+Math.max(0,enemy.hp);
}
if(myName)document.getElementById('nameInput').value=myName;
render();save();loadLeaderboard();
</script>
</body>
</html>
