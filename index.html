<script>
const warriors=[
 {name:"Tailwhip",emoji:"🦖",hp:120,power:22,price:200},
 {name:"Nightblade",emoji:"🥷",hp:100,power:25,price:200},

 {name:"Storm Strike",emoji:"🌪️",hp:110,power:28,price:300},
 {name:"Fire Fist",emoji:"🔥",hp:105,power:30,price:300},
 {name:"Shadow Shogun",emoji:"👺",hp:95,power:34,price:320},
 {name:"Venom Fang",emoji:"🕷️",hp:90,power:36,price:400},
 {name:"Legendary Tailwhip",emoji:"👑🦖",hp:160,power:30,price:550},
 {name:"Ultimate Mizuchi",emoji:"👑🐲",hp:140,power:38,price:600},
 {name:"Shadow King",emoji:"👑😈",hp:130,power:40,price:600},
 {name:"Giant Tailwhip",emoji:"🦖💪",hp:200,power:25,price:700},
 {name:"Ninja Boss",emoji:"🥷👹",hp:170,power:28,price:800},
 {name:"Akedo Champion",emoji:"🏆",hp:180,power:30,price:1000}
];
const FIREBASE_CONFIG={apiKey:'AIzaSyAAC69POUXbXg6ZEgPe6sDM47BIZ481GYU',authDomain:'akkedo-leaderboard.firebaseapp.com',databaseURL:'https://akkedo-leaderboard-default-rtdb.firebaseio.com/',projectId:'akkedo-leaderboard',appId:'1:439652455789:web:dd71b7f5f4e3b8e2a7b664'};
let firebaseDb=null,firebaseAuthReady=null,firebaseSetupError='';
let coins=parseInt(localStorage.getItem('akedo_coins')||'100',10);
let wins=parseInt(localStorage.getItem('akedo_wins')||'0',10);
let points=parseInt(localStorage.getItem('akedo_points')||'0',10);
let myName=localStorage.getItem('akedo_name')||'';
let owned=JSON.parse(localStorage.getItem('akedo_owned')||'[0]');
let playerIdx=0,player,enemy,myTurn=true,isOnline=false,isHost=false,peer=null,roomConn=null,gameConn=null,connectionTimeout=null,connectionTimedOut=false,roomCode='',myPeerId='',isRoomHost=false,roomMembers=[],pendingChallenge=null,roomMatch=null,activeMatch=null,pendingDirectMatch=null,defending=false,enemyDefending=false,splitUsed=false,gameOver=false;

function save(){
 localStorage.setItem('akedo_coins',coins);localStorage.setItem('akedo_wins',wins);localStorage.setItem('akedo_points',points);localStorage.setItem('akedo_owned',JSON.stringify(owned));
 document.getElementById('coinsText').textContent=coins;document.getElementById('winsText').textContent=wins;document.getElementById('pointsText').textContent=points;document.getElementById('myNameText').textContent=myName||'שחקן';
 if(roomCode)publishProfile();
}
function saveName(){
 const value=document.getElementById('nameInput').value.trim();
 if(!value){alert('תכתוב שם!');return;}
 myName=value;localStorage.setItem('akedo_name',value);save();uploadScore();loadLeaderboard();publishProfile();alert('ברוך הבא '+value+'! אתה עכשיו בלוח העולמי 🌍');
}
function configureLeaderboard(){
 if(!Object.values(FIREBASE_CONFIG).every(Boolean))return;
 if(typeof firebase==='undefined'){firebaseSetupError='ספריית Firebase לא נטענה.';return;}
 try{
  firebase.initializeApp(FIREBASE_CONFIG);firebaseDb=firebase.database();firebaseAuthReady=firebase.auth().signInAnonymously();
  firebaseAuthReady.catch(error=>{firebaseSetupError=error.message;});
 }catch(error){firebaseSetupError=error.message;}
}
async function uploadScore(){
 if(!myName)return;
 if(firebaseDb){
  try{
   await firebaseAuthReady;const uid=firebase.auth().currentUser.uid;
   await firebaseDb.ref('scores/'+uid).set({name:myName,wins:wins,points:points,coins:coins,time:Date.now()});
  }catch(error){firebaseSetupError=error.message;console.warn('Leaderboard upload failed:',error);}
 }
 const local=JSON.parse(localStorage.getItem('akedo_local_leader')||'[]');local.push({name:myName,wins:wins,points:points});localStorage.setItem('akedo_local_leader',JSON.stringify(local));
}
async function loadLeaderboard(){
 const status=document.getElementById('leaderStatus');status.textContent='טוען לוח עולמי...';
 let list=[];let remoteAvailable=false;
 const isValidScore=item=>item&&typeof item.name==='string'&&Number.isFinite(Number(item.points));
 if(firebaseDb){
  try{
   await firebaseAuthReady;const snapshot=await firebaseDb.ref('scores').once('value');const data=snapshot.val();
   if(data&&typeof data==='object')Object.values(data).filter(isValidScore).forEach(item=>list.push(item));
   remoteAvailable=true;
  }catch(error){firebaseSetupError=error.message;console.warn('Leaderboard unavailable:',error);}
 }
 const local=JSON.parse(localStorage.getItem('akedo_local_leader')||'[]');list=list.concat(local.filter(isValidScore));
 if(list.length===0)list=[{name:'Akedo King 👑',wins:45,points:4500},{name:'דניאל המלך',wins:32,points:3200},{name:'נינגה 123',wins:28,points:2800},{name:'🦖 דינו',wins:20,points:2000},{name:'שחקן חדש',wins:5,points:500}];
 const best={};list.forEach(item=>{if(item&&typeof item.name==='string'&&Number.isFinite(Number(item.points))&&(!best[item.name]||Number(item.points)>Number(best[item.name].points)))best[item.name]=item;});
 let entries=Object.values(best).sort((a,b)=>Number(b.points)-Number(a.points)).slice(0,20);
 if(myName&&!entries.some(item=>item.name===myName))entries.push({name:myName,wins:wins,points:points});
 entries.sort((a,b)=>Number(b.points)-Number(a.points));
 const container=document.getElementById('leaderList');container.replaceChildren();
 const leader=document.createElement('div');leader.className='leader';
 entries.forEach((item,index)=>{
  const row=document.createElement('div');row.className='leaderRow'+(item.name===myName?' me':'');
  const name=document.createElement('span');name.className=index===0?'rank1':index===1?'rank2':index===2?'rank3':'';
  const medal=index===0?'🥇':index===1?'🥈':index===2?'🥉':(index+1)+'.';
  name.textContent=medal+' '+item.name+(item.name===myName?' (אתה!)':'');
  const score=document.createElement('span');score.textContent='🏆 '+(Number(item.wins)||0)+' | ⭐ '+(Number(item.points)||0);
  row.append(name,score);leader.appendChild(row);
 });
 container.appendChild(leader);status.textContent=remoteAvailable?'🌍 '+entries.length+' שחקנים בלוח העולמי':(firebaseSetupError?'Firebase לא זמין: '+firebaseSetupError:'לוח מקומי/דוגמה: יש להגדיר פרויקט Firebase לשמירה משותפת');
}
function showTab(tab){
 ['fightTab','shopTab','leaderTab'].forEach(id=>document.getElementById(id).classList.add('hidden'));
 document.getElementById(tab+'Tab').classList.remove('hidden');if(tab==='leader')loadLeaderboard();
}
function render(){
 const grid=document.getElementById('warriorGrid');grid.replaceChildren();
 warriors.forEach((warrior,index)=>{
  if(!owned.includes(index))return;
  const card=document.createElement('div');card.className='card'+(index===playerIdx?' selected':'');
  card.innerHTML='<span class="emo"></span><b></b><br>❤️ '+warrior.hp+' | 👊 '+warrior.power+'<br>🪙 '+warrior.price;
  card.querySelector('.emo').textContent=warrior.emoji;card.querySelector('b').textContent=warrior.name;
    card.onclick=()=>{playerIdx=index;render();publishProfile();};grid.appendChild(card);
 });
 const shop=document.getElementById('shopGrid');shop.replaceChildren();
 warriors.forEach((warrior,index)=>{
  const has=owned.includes(index);const card=document.createElement('div');card.className='card';
  card.innerHTML='<span class="emo"></span><b></b><br>❤️ '+warrior.hp+' | 👊 '+warrior.power+'<br>'+(has?'✅ יש לך!':'🪙 '+warrior.price);
  card.querySelector('.emo').textContent=warrior.emoji;card.querySelector('b').textContent=warrior.name;
  if(!has){const buy=document.createElement('button');buy.className='orange';buy.textContent='קנה';buy.onclick=()=>{if(coins<warrior.price){alert('אין מספיק!');return;}coins-=warrior.price;owned.push(index);save();render();};card.appendChild(buy);}
  shop.appendChild(card);
 });
}
function clearConnectionTimeout(){if(connectionTimeout){clearTimeout(connectionTimeout);connectionTimeout=null;}}
function setConnectionStatus(message){document.getElementById('connectionStatus').textContent=message;}
const MAX_ROOM_PLAYERS=6;
function startConnectionTimeout(message,onTimeout,preservePeer=false){
 clearConnectionTimeout();connectionTimedOut=false;
 connectionTimeout=setTimeout(()=>{
  connectionTimeout=null;connectionTimedOut=true;
  if(preservePeer){if(gameConn){gameConn.close();gameConn=null;}}
  else{const pendingPeer=peer;peer=null;roomConn=null;gameConn=null;isOnline=false;if(pendingPeer)pendingPeer.destroy();}
  onTimeout();
 },30000);
 setConnectionStatus(message);setLobbyStatus(message);
}
function closePeer(){
 clearConnectionTimeout();connectionTimedOut=false;
 if(gameConn){gameConn.close();gameConn=null;}
 if(roomConn){roomConn.close();roomConn=null;}
 if(peer){peer.destroy();peer=null;}
 isOnline=false;isRoomHost=false;roomCode='';myPeerId='';roomMembers=[];pendingChallenge=null;roomMatch=null;activeMatch=null;pendingDirectMatch=null;
}
function showLobby(){document.getElementById('menu').classList.add('hidden');document.getElementById('battleScreen').classList.add('hidden');document.getElementById('lobbyScreen').classList.remove('hidden');renderLobby();}
function showMenu(){document.getElementById('lobbyScreen').classList.add('hidden');document.getElementById('battleScreen').classList.add('hidden');document.getElementById('menu').classList.remove('hidden');showTab('fight');}
function backToMenu(){if(roomCode){returnToLobby(true);return;}closePeer();showMenu();}
function setLobbyStatus(message){document.getElementById('lobbyStatus').textContent=message;}
function profileFor(id){return{id:id,name:myName||'שחקן',wins:wins,points:points,warrior:playerIdx,host:isRoomHost,inBattle:false};}
function publicMember(member){return{id:member.id,name:member.name,wins:member.wins,points:member.points,warrior:member.warrior,host:member.host,inBattle:!!member.inBattle};}
function memberById(id){return roomMembers.find(member=>member.id===id);}
function renderLobby(){
 document.getElementById('lobbyRoomCode').textContent=roomCode;
 const list=document.getElementById('lobbyPlayers');list.replaceChildren();
 roomMembers.forEach(member=>{
  const row=document.createElement('div');row.className='lobbyPlayer';
  const description=document.createElement('span');description.textContent=(member.host?'👑 ':'')+member.name+' | 🏆 '+member.wins+' | ⭐ '+member.points+(member.inBattle?' | בקרב':' | ממתין');row.appendChild(description);
  if(member.id!==myPeerId){const challenge=document.createElement('button');challenge.className='blue';challenge.textContent='אתגר';challenge.disabled=!!pendingChallenge||!!activeMatch||!!member.inBattle;challenge.onclick=()=>requestChallenge(member.id);row.appendChild(challenge);}
  list.appendChild(row);
 });
 const incoming=document.getElementById('incomingChallenge');const cancel=document.getElementById('cancelChallengeButton');
 const challenger=pendingChallenge&&memberById(pendingChallenge.from);const target=pendingChallenge&&memberById(pendingChallenge.to);
 const isTarget=pendingChallenge&&pendingChallenge.to===myPeerId;
 incoming.classList.toggle('hidden',!isTarget);cancel.classList.toggle('hidden',!pendingChallenge||pendingChallenge.from!==myPeerId);
 if(isTarget)document.getElementById('challengeText').textContent=(challenger?challenger.name:'שחקן')+' מאתגר אותך!';
 if(pendingChallenge&&!isTarget&&pendingChallenge.from!==myPeerId)setLobbyStatus((challenger?challenger.name:'שחקן')+' מאתגר את '+(target?target.name:'שחקן')+'.');
}
function broadcastRoomState(){
 const message={type:'room-state',members:roomMembers.map(publicMember),pendingChallenge:pendingChallenge};
 roomMembers.forEach(member=>{if(member.connection&&member.connection.open)member.connection.send(message);});renderLobby();
}
function sendLobbyMessage(targetId,message){
 if(targetId===myPeerId){handleClientRoomMessage(message);return;}
 const member=memberById(targetId);if(member&&member.connection&&member.connection.open)member.connection.send(message);
}
function handleHostRoomMessage(senderId,message,sourceConnection){
 if(!message||typeof message!=='object')return;
 if(message.type==='join'){
  clearConnectionTimeout();
  if(roomMembers.length>=MAX_ROOM_PLAYERS){sourceConnection.send({type:'room-full'});sourceConnection.close();return;}
  if(memberById(senderId))return;
  roomMembers.push({id:senderId,name:String(message.name||'שחקן').slice(0,24),wins:Number(message.wins)||0,points:Number(message.points)||0,warrior:warriors[message.warrior]?message.warrior:0,host:false,inBattle:false,connection:sourceConnection});
  broadcastRoomState();setLobbyStatus('שחקנים בחדר: '+roomMembers.length+' / '+MAX_ROOM_PLAYERS);return;
 }
 const sender=memberById(senderId);if(!sender)return;
 if(message.type==='profile'){
  sender.name=String(message.name||'שחקן').slice(0,24);sender.wins=Number(message.wins)||0;sender.points=Number(message.points)||0;sender.warrior=warriors[message.warrior]?message.warrior:sender.warrior;broadcastRoomState();
 }else if(message.type==='leave'){
  roomMembers=roomMembers.filter(member=>member.id!==senderId);
  if(pendingChallenge&&(pendingChallenge.from===senderId||pendingChallenge.to===senderId))pendingChallenge=null;
  if(roomMatch&&roomMatch.players.includes(senderId)){const opponent=roomMatch.players.find(id=>id!==senderId);sendLobbyMessage(opponent,{type:'match-ended',matchId:roomMatch.id});roomMatch=null;}
  broadcastRoomState();
 }else if(message.type==='challenge'){
  const target=memberById(message.targetId);
  if(!target||target.id===senderId||pendingChallenge||roomMatch||sender.inBattle||target.inBattle){sendLobbyMessage(senderId,{type:'challenge-error',text:'השחקן אינו זמין כרגע.'});return;}
  pendingChallenge={from:senderId,to:target.id};broadcastRoomState();
 }else if(message.type==='accept-challenge'){
  if(!pendingChallenge||pendingChallenge.to!==senderId)return;
  const challenger=memberById(pendingChallenge.from);const target=memberById(pendingChallenge.to);
  if(!challenger||!target){pendingChallenge=null;broadcastRoomState();return;}
  const matchId=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  roomMatch={id:matchId,players:[challenger.id,target.id]};challenger.inBattle=true;target.inBattle=true;pendingChallenge=null;
  sendLobbyMessage(challenger.id,{type:'challenge-start',initiator:true,match:{id:matchId,opponent:publicMember(target)}});
  sendLobbyMessage(target.id,{type:'challenge-start',initiator:false,match:{id:matchId,opponent:publicMember(challenger)}});
  broadcastRoomState();
 }else if(message.type==='decline-challenge'||message.type==='cancel-challenge'){
  if(pendingChallenge&&(pendingChallenge.from===senderId||pendingChallenge.to===senderId)){pendingChallenge=null;broadcastRoomState();}
 }else if(message.type==='match-ended'){
  if(!roomMatch||roomMatch.id!==message.matchId||!roomMatch.players.includes(senderId))return;
  const opponent=roomMatch.players.find(id=>id!==senderId);sendLobbyMessage(opponent,{type:'match-ended',matchId:roomMatch.id});
  roomMatch.players.forEach(id=>{const member=memberById(id);if(member)member.inBattle=false;});roomMatch=null;broadcastRoomState();
 }
}
function handleClientRoomMessage(message){
 if(!message||typeof message!=='object')return;
 if(message.type==='room-state'){
  roomMembers=Array.isArray(message.members)?message.members:[];pendingChallenge=message.pendingChallenge||null;renderLobby();setLobbyStatus('שחקנים בחדר: '+roomMembers.length+' / '+MAX_ROOM_PLAYERS);
 }else if(message.type==='challenge-start'){
  pendingDirectMatch=message.match;activeMatch=message.match;renderLobby();
  if(message.initiator)startDirectMatch(message.match,true);
  else startConnectionTimeout('האתגר התקבל. מתחבר ליריב...',()=>{setLobbyStatus('החיבור לקרב נכשל. נסה שוב מהלובי.');returnToLobby(true);},true);
 }else if(message.type==='challenge-error')setLobbyStatus(message.text);
 else if(message.type==='room-full'){closePeer();showMenu();setConnectionStatus('החדר מלא (מקסימום 6 שחקנים).');}
 else if(message.type==='room-closed'){closePeer();showMenu();setConnectionStatus('המארח סגר את החדר.');}
 else if(message.type==='match-ended'&&pendingDirectMatch&&pendingDirectMatch.id===message.matchId)returnToLobby(false);
}
function handlePeerConnection(connection){
 if(connection.metadata&&connection.metadata.type==='game'){
  if(!pendingDirectMatch||connection.metadata.matchId!==pendingDirectMatch.id){connection.close();return;}
  setupGameConnection(connection,pendingDirectMatch,false);return;
 }
 if(!isRoomHost){connection.close();return;}
 connection.on('data',message=>handleHostRoomMessage(connection.peer,message,connection));
 connection.on('close',()=>handleHostRoomMessage(connection.peer,{type:'leave'},connection));
 connection.on('error',error=>setLobbyStatus('שגיאת חיבור: '+error.message));
}
function setupGameConnection(connection,match,initiator){
 gameConn=connection;
 connection.on('open',()=>{clearConnectionTimeout();connectionTimedOut=false;startOnlineBattle(match.opponent.warrior,initiator);});
 connection.on('data',message=>{if(message&&message.type==='attack'&&Number.isInteger(message.attack))receiveAttack(message.attack);});
 connection.on('close',()=>{if(isOnline&&!gameOver)returnToLobby(false);});
 connection.on('error',error=>{setLobbyStatus('שגיאת קרב: '+error.message);if(isOnline)returnToLobby(true);});
}
function startDirectMatch(match,initiator){
 if(!peer||!match||!match.opponent)return;
 startConnectionTimeout('מתחבר ליריב...',()=>{setLobbyStatus('החיבור לקרב נכשל. נסה שוב מהלובי.');returnToLobby(true);},true);
 if(initiator){const connection=peer.connect(match.opponent.id,{metadata:{type:'game',matchId:match.id}});setupGameConnection(connection,match,true);}
}
function requestChallenge(targetId){const message={type:'challenge',targetId:targetId};if(isRoomHost)handleHostRoomMessage(myPeerId,message);else if(roomConn&&roomConn.open)roomConn.send(message);}
function acceptChallenge(){if(isRoomHost)handleHostRoomMessage(myPeerId,{type:'accept-challenge'});else if(roomConn&&roomConn.open)roomConn.send({type:'accept-challenge'});}
function declineChallenge(){if(isRoomHost)handleHostRoomMessage(myPeerId,{type:'decline-challenge'});else if(roomConn&&roomConn.open)roomConn.send({type:'decline-challenge'});}
function cancelChallenge(){if(isRoomHost)handleHostRoomMessage(myPeerId,{type:'cancel-challenge'});else if(roomConn&&roomConn.open)roomConn.send({type:'cancel-challenge'});}
function publishProfile(){
 const profile=profileFor(myPeerId);
 if(isRoomHost){const member=memberById(myPeerId);if(member)Object.assign(member,profile);broadcastRoomState();}
 else if(roomConn&&roomConn.open)roomConn.send({type:'profile',name:profile.name,wins:profile.wins,points:profile.points,warrior:profile.warrior});
}
function returnToLobby(notifyHost){
 const matchId=pendingDirectMatch&&pendingDirectMatch.id;clearConnectionTimeout();
 if(notifyHost&&matchId){if(isRoomHost)handleHostRoomMessage(myPeerId,{type:'match-ended',matchId});else if(roomConn&&roomConn.open)roomConn.send({type:'match-ended',matchId});}
 isOnline=false;gameOver=false;
 if(gameConn){const current=gameConn;gameConn=null;current.close();}
 pendingDirectMatch=null;activeMatch=null;showLobby();setLobbyStatus('שחקנים בחדר: '+roomMembers.length+' / '+MAX_ROOM_PLAYERS);
}
function leaveRoom(){
 if(isRoomHost)roomMembers.forEach(member=>{if(member.connection&&member.connection.open)member.connection.send({type:'room-closed'});});
 else if(roomConn&&roomConn.open)roomConn.send({type:'leave'});
 closePeer();showMenu();setConnectionStatus('יצאת מהחדר.');
}
function createRoom(){
 if(peer)return;
 if(typeof Peer==='undefined'){setConnectionStatus('לא ניתן לטעון את PeerJS. בדוק חיבור לאינטרנט ורענן את הדף.');return;}
 roomCode=String(Math.floor(10000000+Math.random()*90000000));isRoomHost=true;roomMembers=[];document.getElementById('myCode').textContent='יוצר חדר...';peer=new Peer('akedo-'+roomCode);
 peer.on('connection',handlePeerConnection);
 peer.on('error',error=>{clearConnectionTimeout();setLobbyStatus(error.type==='unavailable-id'?'הקוד תפוס. צור חדר חדש.':'שגיאת חיבור: '+error.message);});
 startConnectionTimeout('מתחבר לשרת...',()=>{roomCode='';isRoomHost=false;roomMembers=[];showMenu();setConnectionStatus('לא נמצא שחקן תוך 30 שניות. צור חדר חדש ונסה שוב.');});
 peer.on('open',id=>{
  myPeerId=id;document.getElementById('myCode').textContent='הקוד שלך: '+roomCode+' - שלח לחברים!';roomMembers=[{...profileFor(id),host:true,connection:null}];showLobby();
  startConnectionTimeout('ממתין לשחקן הראשון (עד 30 שניות)...',()=>{roomCode='';isRoomHost=false;roomMembers=[];showMenu();setConnectionStatus('לא הצטרף שחקן תוך 30 שניות. צור חדר חדש ונסה שוב.');});
 });
}
function joinRoom(){
 const code=document.getElementById('joinCode').value.trim();
 if(!/^\d{6,8}$/.test(code)){setConnectionStatus('יש להזין קוד בן 6–8 ספרות.');return;}
 if(peer)return;if(typeof Peer==='undefined'){setConnectionStatus('לא ניתן לטעון את PeerJS. בדוק חיבור לאינטרנט ורענן את הדף.');return;}
 roomCode=code;isRoomHost=false;peer=new Peer();peer.on('connection',handlePeerConnection);
 startConnectionTimeout('מתחבר לחדר...',()=>{roomCode='';showMenu();setConnectionStatus('החיבור לא הושלם תוך 30 שניות. בדוק את הקוד או נסה רשת אחרת.');});
 peer.on('open',id=>{
  myPeerId=id;roomConn=peer.connect('akedo-'+code);
  roomConn.on('open',()=>{clearConnectionTimeout();roomConn.send({type:'join',name:myName||'שחקן',wins:wins,points:points,warrior:playerIdx});showLobby();setLobbyStatus('התחברת לחדר. טוען שחקנים...');});
  roomConn.on('data',handleClientRoomMessage);
  roomConn.on('close',()=>{if(roomCode){closePeer();showMenu();setConnectionStatus('החיבור לחדר נסגר.');}});
  roomConn.on('error',error=>setConnectionStatus('שגיאת חדר: '+error.message));
 });
 peer.on('error',error=>{clearConnectionTimeout();const message=error.type==='peer-unavailable'?'לא נמצא חדר עם הקוד הזה. בדוק שהמארח עדיין מחובר ונסה קוד חדש.':'שגיאת חיבור: '+error.message;closePeer();showMenu();setConnectionStatus(message);});
}
function startOnlineBattle(enemyIndex,startsTurn){
 player={...warriors[playerIdx],max:warriors[playerIdx].hp};enemy={...warriors[enemyIndex],max:warriors[enemyIndex].hp};isOnline=true;isHost=startsTurn;myTurn=startsTurn;gameOver=false;splitUsed=false;defending=false;enemyDefending=false;
 document.getElementById('menu').classList.add('hidden');document.getElementById('lobbyScreen').classList.add('hidden');document.getElementById('battleScreen').classList.remove('hidden');document.getElementById('modeText').textContent='🌐 אונליין';document.getElementById('playerEmoji').textContent=player.emoji;document.getElementById('enemyEmoji').textContent=enemy.emoji;updateBars();updateTurnUI();document.getElementById('log').textContent='READY? FIGHT!';
}
function updateTurnUI(){
 document.getElementById('myTurnBtns').classList.toggle('hidden',!myTurn||gameOver);document.getElementById('waitText').classList.toggle('hidden',myTurn||gameOver);document.getElementById('modeText').textContent=gameOver?'🏁 נגמר!':(myTurn?'✅ תורך!':'⏳ תור היריב...');
}
function sendAttack(type){
 if(!myTurn||gameOver)return;
 if(type===4&&splitUsed){document.getElementById('log').textContent='כבר השתמשת ב-SPLIT STRIKE!';return;}
 doAttack(type,true);
 if(isOnline&&gameConn&&gameConn.open)gameConn.send({type:'attack',attack:type});
 else if(!gameOver){myTurn=false;updateTurnUI();setTimeout(enemyOfflineTurn,800);}
}
function doAttack(type,isMe){
 const log=document.getElementById('log');const attacker=isMe?player:enemy;const defender=isMe?enemy:player;const isDefending=isMe?enemyDefending:defending;
 if(type===3){if(isMe)defending=true;else enemyDefending=true;log.textContent='🛡️ מתגונן!';if(isOnline){myTurn=!isMe;updateTurnUI();}return;}
 if(isDefending){log.textContent='🛡️ חסום!';if(isMe)enemyDefending=false;else defending=false;}
 else{
  let damage=0;if(type===1)damage=attacker.power;
  if(type===2){if(Math.random()<.5)damage=35;else log.textContent='😱 החטאה!';}
  if(type===4){splitUsed=true;damage=50;log.textContent='💥 SPLIT STRIKE! ';}
  defender.hp-=damage;if(damage>0)log.textContent=(isMe?'👊 פגעת! ':'💥 היריב פגע! ')+damage+' נזק!';
 }
 updateBars();
 if(defender.hp<=0){gameOver=true;if(isMe){wins++;coins+=50;points+=100;save();uploadScore();log.textContent='🏆 ניצחת! +50 🪙 +100 ⭐';}else{coins+=10;points+=10;save();uploadScore();log.textContent='💔 הפסדת... +10 ⭐';}updateTurnUI();return;}
 if(isOnline){myTurn=!isMe;updateTurnUI();}
}
function receiveAttack(type){if([1,2,3,4].includes(type))doAttack(type,false);}
function enemyOfflineTurn(){
 if(gameOver)return;
 if(defending){document.getElementById('log').textContent+='\n🛡️ חסמת!';defending=false;}
 else{const damage=enemy.power;player.hp-=damage;document.getElementById('log').textContent+='\n💥 המחשב תקף! '+damage;updateBars();}
 if(player.hp<=0){coins+=10;points+=10;save();uploadScore();gameOver=true;document.getElementById('log').textContent+='\n💔 הפסדת...';}
 if(!gameOver)myTurn=true;updateTurnUI();
}
function startOffline(){
 closePeer();player={...warriors[playerIdx],max:warriors[playerIdx].hp};let enemyIndex=Math.floor(Math.random()*warriors.length);if(enemyIndex===playerIdx)enemyIndex=(enemyIndex+1)%warriors.length;enemy={...warriors[enemyIndex],max:warriors[enemyIndex].hp};
 isOnline=false;myTurn=true;gameOver=false;splitUsed=false;defending=false;document.getElementById('menu').classList.add('hidden');document.getElementById('battleScreen').classList.remove('hidden');document.getElementById('modeText').textContent='🤖 נגד המחשב';document.getElementById('playerEmoji').textContent=player.emoji;document.getElementById('enemyEmoji').textContent=enemy.emoji;updateBars();updateTurnUI();document.getElementById('log').textContent='READY? FIGHT!';
}
function updateBars(){
 document.getElementById('playerBar').style.width=Math.max(0,player.hp/player.max*100)+'%';document.getElementById('enemyBar').style.width=Math.max(0,enemy.hp/enemy.max*100)+'%';document.getElementById('playerName').textContent=player.name+' - '+Math.max(0,player.hp);document.getElementById('enemyName').textContent=enemy.name+' - '+Math.max(0,enemy.hp);
}
if(myName)document.getElementById('nameInput').value=myName;
configureLeaderboard();render();save();loadLeaderboard();
</script>
</body>
</html>
